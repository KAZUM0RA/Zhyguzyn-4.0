name: Release

# Запускається при пуші тегу версії, наприклад: git tag v1.2.3 && git push origin v1.2.3
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Перевірити формат тегу
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Тег має бути у форматі v1.2.3, отримано: $TAG"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Перевірити секрети підпису
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Секрет $name не задано (Settings → Secrets and variables → Actions)"
              missing=1
            fi
          done
          exit $missing

      - name: Відновити keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Unit-тести
        run: ./gradlew testDebugUnitTest

      - name: Зібрати підписаний release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PappVersion="$TAG"

      - name: Перевірити підпис
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs "$APK"
          # Страховка: release не має бути підписаний debug-ключем.
          if "$APKSIGNER" verify --print-certs "$APK" | grep -q "CN=Android Debug"; then
            echo "::error::APK підписано debug-ключем — перевірте секрети"
            exit 1
          fi
          mkdir -p dist
          cp "$APK" "dist/zhyguzyn-$TAG.apk"

      - name: Опублікувати GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Опис змін: повідомлення анотованого тегу, інакше — автоматичні нотатки GitHub.
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          NOTES=""
          if [ "$(git cat-file -t "$TAG")" = "tag" ]; then
            NOTES=$(git tag -l --format='%(contents)' "$TAG" | sed '/-----BEGIN PGP SIGNATURE-----/,$d')
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "dist/zhyguzyn-$TAG.apk" --clobber
          elif [ -n "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            gh release create "$TAG" "dist/zhyguzyn-$TAG.apk" --title "$TAG" --notes "$NOTES" --verify-tag
          else
            gh release create "$TAG" "dist/zhyguzyn-$TAG.apk" --title "$TAG" --generate-notes --verify-tag
          fi

      - name: Прибрати keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
