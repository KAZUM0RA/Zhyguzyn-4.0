name: Build

# Збірка APK на кожен пуш у гілку та PR. Готовий APK — в артефактах запуску
# (Actions → запуск → Artifacts). Для публікації релізу див. release.yml.
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Відновити keystore (якщо секрети задані)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Секрети підпису не задано — APK буде підписано тимчасовим debug-ключем (лише для перевірки)."
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Unit-тести
        run: ./gradlew testDebugUnitTest

      - name: Зібрати release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - uses: actions/upload-artifact@v7
        with:
          name: zhyguzyn-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Прибрати keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
